name: Build Sekretiri APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass android -keypass android \
            -alias sekretiri -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Sekretiri, OU=Dev, O=Sekretiri, L=Baghdad, S=Baghdad, C=IQ"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: sekretiri
          ANDROID_KEY_PASSWORD: android
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekretiri-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
