name: sekretiri_flutter
description: Flutter client for Sekretiri Clinic.
publish_to: "none"
version: 0.2.7+8

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/logo.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#0C4A6E"
  adaptive_icon_foreground: assets/brand/logo.png
  adaptive_icon_foreground_inset: 18
  adaptive_icon_monochrome: assets/brand/logo.png
  web:
    generate: true
    image_path: assets/brand/logo.png
    background_color: "#F0F9FF"
    theme_color: "#0EA5E9"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
